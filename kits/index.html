<script>
const P=JSON.parse(document.getElementById("seatplan-data").textContent);
const G=P.groups,DATE=P.date||"";
const MANY=new Set(G.map(g=>g.title||"")).size>1;
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const out=document.getElementById("out"),inp=document.getElementById("r");
const N=s=>String(s).toUpperCase().replace(/[^0-9A-Z]/g,"");   // ignore spaces, - / .
const A=G.map(g=>{const a={};for(const k in g.rolls){a[N(k)]=k}return a});
function card(g,x){const own=x[3]&&x[3]!==g.time;const T=x[3]||g.time||"";

return '<div class="card">'+(MANY&&g.title?'<div class="gt">'+E(g.title)+'</div>':'')+
(own?'<div class="k">Your paper time</div><div class="blk">'+E(x[3])+'</div>':'')+
(WHEN&&!own?'<div class="k" style="margin-bottom:10px">'+E(WHEN)+'</div>':'')+
(x[2]?'<div class="k">Block</div><div class="blk">'+E(x[2])+'</div>':'')+

'<div class="grid"><div><div class="k">Semester / branch</div><div class="v">'+E(x[1])+'</div></div></div>'+
'<div class="k" style="margin-top:12px">Your seat number is shown on the seating chart at the room door.</div></div>'}
function show(roll){roll=roll.trim().toUpperCase();const hits=[];
G.forEach((g,i)=>{const x=g.rolls[roll]||g.rolls[A[i][N(roll)]];if(x)hits.push(card(g,x))});
if(!hits.length){out.innerHTML='<p class="err">Roll number '+E(roll)+' not found. '+

out.innerHTML=hits.join("")}
